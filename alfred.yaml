# hey_alfred, second attempt. Paths are relative to pipeline.py's --root
# (default C:\Users\tillm\wake), NOT to this file - the data is 16 GB and stays
# out of the repo.
#
# n_samples / steps / max_negative_weight follow livekit's prod.yaml:
# 10000 -> 25000 (openWakeWord's stated minimum is 20,000; stock hey_jarvis
# used 200,000), 50000 -> 100000 steps (medium took 12 min at 50k, so ~25 min),
# max_negative_weight 1500 -> 3000.
# n_background_samples is a standalone NEGATIVE class in the batch, not just
# augmentation noise.
#
# augmentation.rounds stays at 1: pipeline.py widens the background SNR to
# 0..20 dB and rounds compound, so three rounds land near -18 dB.

model_name: hey_alfred

target_phrases:
  - "hey alfred"              # hˈeɪ ˈælfɹɪd  - relaxed "AL-frid"
  - "hey al fred"             # how Flux actually renders it (see strip_wake)

# Hard negatives, TTS-generated like the positives. "alfred" alone - the wake
# word with its greeting stripped - is what a TV says when a character is
# named, and the commonest false trigger there is.
custom_negative_phrases:
  - "alfred"
  - "al fred"
  - "hey al"
  - "hey fred"
  - "hey alfred's"
  - "hey all"
  - "hey alfie"
  - "hey albert"
  - "say alfred"
  - "it's alfred"

# RUN-ON POSITIVES, added by pipeline.py's --continuations. Not part of
# livekit's schema; load_config pops this key.
#
# The score crests about a second AFTER the talker stops, on the quiet /d/
# decay, so a command said in one breath stomps the window the model needs:
# measured on v1.0, "hey alfred play hades" scores 0.011-0.041 where isolated
# utterances median 0.678. Synthesised whole, not stitched - the phenomenon IS
# the coarticulation.
#
# Keep every form under ~1.6 s: the clip is written into a 2 s window ending at
# target_len minus 0-200 ms of jitter and cropped from the FRONT if it does not
# fit, so a long continuation loses "hey alfred" (check_positive_lengths).
#
# First words are grammar.yaml's command vocabulary, chosen for varied onsets
# (plosive, fricative, nasal, vowel) so the model learns "the phrase, then more
# speech" rather than "the phrase, then the word play".
continuation_phrases:
  - "hey alfred play"
  - "hey alfred start"
  - "hey alfred stop"
  - "hey alfred pause"
  - "hey alfred open"
  - "hey alfred launch"
  - "hey alfred switch to"
  - "hey alfred go back"
  - "hey alfred show"
  - "hey alfred mute"
  - "hey alfred volume"
  - "hey alfred turn it up"

n_samples: 25000
n_samples_val: 2000
# 4000 was TRIED when the pool grew 2,274 -> 6,324 files (2026-08-21 Bgcount
# run: 4 seeds vs the 4 pad2 seeds over the same 6 honest heldout hours). It
# LOST: FA 0.83-1.0/hr at the budget thresholds vs pad2's 0.50-0.83, best noisy
# recall 47% at +10 dB vs pad2_s0's 55%, ceilings no better.
n_background_samples: 2000
n_background_samples_val: 400

data_dir: ./data
output_dir: ./output

augmentation:
  rounds: 1
  # Globbed **/*.wav, so every subfolder counts.
  #
  #   noise/  MUSAN, 774 files. No intelligible speech BY DESIGN - rain, wind,
  #           DTMF, footsteps.
  #   room/   sliced film. Dialogue-heavy.
  #   game/   sliced gameplay - percussive transients, compressed VO over a
  #           music bed, and the source of every confirmed false accept so far.
  #
  # Aim for room+game to be at least half the pool, split evenly. The augmenter
  # picks a background with random.choice over FILES, so weight is per file:
  # 774 MUSAN against 600 room clips means MUSAN wins 56% of mixes. 40 minutes
  # each of film and gameplay (~600 clips each) puts the room at ~61%.
  #
  # People talking over these recordings is good data. The one rule is that
  # nobody says the wake phrase or its fragments: in a background it becomes a
  # NEGATIVE, and in held-out audio it punishes correct fires.
  background_paths: ["data/backgrounds"]
  rir_paths: ["data/rirs"]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
# trainer.py doubles the negative weight after phase 1 and again after phase 2
# when validation FPPH is over target - twice, never again, so 3000 caps out at
# 12000. On 2026-08-17 the controls never triggered it while EVERY pad-then-mix
# model doubled twice, hit the ceiling and still finished 10-17x over the 0.2
# FP/hr target. Swept as `-nw` variants rather than raised here.
max_negative_weight: 3000.0

# Hyperparameter sweep. Every variant trains against BYTE-IDENTICAL data -
# generate/augment/features run once and are shared, and pipeline.py refuses a
# variant that reaches past training into them (TRAINING_ONLY). Rank the
# results with Bench.bat: the synthetic eval scores every candidate the same.
variants:
  medium:       {model: {model_size: medium}}
  # 2026-08-16, on data still carrying the silence shortcut, more steps was the
  # ONE lever that worked - recall with the phrase said over room audio:
  #
  #                      +20dB  +15dB  +10dB   +5dB   0dB
  #     medium (100k)      39%    35%    23%    17%    9%
  #     medium-200k        47%    40%    32%    19%   11%
  #     v1.0 (incumbent)   46%    35%    21%    15%    9%
  #
  # 2026-08-17, with pad-then-mix, 400k REVERSED it: peak median 0.978 but
  # noise ceiling 0.913 - 1.07x separation, threshold forced to 0.60-0.70,
  # never zero false accepts at any threshold up to 0.80. The 100k pad model
  # separates 6.2x and holds 88% recall at ZERO false accepts. Neither reading
  # is safe to generalise, so 100k and 200k are swept across seeds.
  medium-200k:  {model: {model_size: medium}, steps: 200000}
  # 400k is DEFINED but not in the sweep: two seeds are precision-broken
  # (above) and it costs 88 min a model. Re-test only with a raised negative
  # weight, the hypothesis for why it broke.
  medium-400k:  {model: {model_size: medium}, steps: 400000}
  # Same two lengths against a negative weight the trainer cannot reach on its
  # own: 12000 as the BASE lets phase 2/3 escalate to 48000.
  medium-nw:      {model: {model_size: medium}, max_negative_weight: 12000.0}
  medium-200k-nw: {model: {model_size: medium}, steps: 200000,
                   max_negative_weight: 12000.0}
  # large loses to medium in every generation on every axis - do not re-add it.
  # Stock hey_jarvis, more robust in noise, uses a DNN head; everything here is
  # conv_attention. Trained once (v1.2) but on shortcut data.
  dnn-medium:   {model: {model_type: dnn, model_size: medium}}

# The ceiling find_best_threshold optimises recall against. Only means anything
# once make_validation.py has replaced the validation set with real room audio.
target_fp_per_hour: 0.2

# hey_alfred, second attempt. Paths are relative to pipeline.py's --root
# (default C:\Users\tillm\wake), NOT to this file - the data is 16 GB and stays
# out of the repo.
#
# What changed from the 2026-08-15 run and why, since the diff is the whole
# point of this file:
#   n_samples        10000 -> 25000    livekit's own prod.yaml; openWakeWord's
#                                      comment says "20,000 minimum", and stock
#                                      hey_jarvis used 200,000
#   steps            50000 -> 100000   prod.yaml. Medium took 12 min at 50k, so
#                                      this is ~25 min - cheap for the return
#   n_background_    200 -> 2000       this is a standalone NEGATIVE class in
#     samples                          the batch, not just augmentation noise;
#                                      at 200 it was a rounding error beside
#                                      10,000 adversarial TTS negatives
#   max_negative_    1500 -> 3000      prod.yaml
#     weight
#   custom_negative_ (none) -> below   the bare wake word without its greeting
#     phrases                          is the commonest false trigger there is
#
# NOT changed, deliberately: augmentation.rounds stays at 1. pipeline.py widens
# the background SNR to -0..20 dB, and rounds compound - three rounds of a
# widened mix lands near -18 dB and teaches the model to fire on noise.

model_name: hey_alfred

target_phrases:
  - "hey alfred"              # hˈeɪ ˈælfɹɪd  - relaxed "AL-frid"
  - "hey al fred"             # how Flux actually renders it (see strip_wake)

# Hard negatives, TTS-generated like the positives. The first entry is the
# single most valuable one: "alfred" alone, i.e. the wake word with its
# greeting stripped off, which is what a TV says when a character is named.
# The rest are the near-misses the phrase invites - it is sonorant-heavy with
# no sibilant, so its neighbours are many.
custom_negative_phrases:
  - "alfred"
  - "al fred"
  - "hey al"
  - "hey fred"
  - "hey alfred's"
  - "hey all"
  - "hey alfie"
  - "hey albert"
  - "say alfred"
  - "it's alfred"

n_samples: 25000
n_samples_val: 2000
n_background_samples: 2000
n_background_samples_val: 400

data_dir: ./data
output_dir: ./output

augmentation:
  rounds: 1
  # Globbed **/*.wav, so every subfolder counts. The pool the model learns to
  # hear through, and the one place recording effort pays back most:
  #
  #   noise/  MUSAN, 774 files. No intelligible speech BY DESIGN - rain, wind,
  #           DTMF, footsteps. Useless against the thing that actually fires
  #           this model, which is people talking on television.
  #   room/   sliced film. Dialogue-heavy, which is the point.
  #   game/   sliced gameplay. Spectrally a different animal from dialogue -
  #           percussive transients, compressed VO over a music bed - and the
  #           source of every confirmed false accept so far.
  #
  # Aim for room+game to be at least half the pool, split evenly. The augmenter
  # picks a background with random.choice over FILES, so weight is per file:
  # 774 MUSAN against 600 room clips means MUSAN wins 56% of mixes. 40 minutes
  # each of film and gameplay (~600 clips each) puts the room at ~61%.
  #
  # People TALKING over these recordings is good data, not contamination.
  # Live conversation - your voices, direct path, real reverb - is the hardest
  # negative class and the one this pool covers worst: MUSAN has no speech by
  # design and film dialogue is compressed TV speech off a speaker. The one
  # rule is that nobody says the wake phrase or its fragments: in a background
  # it becomes a NEGATIVE and teaches the model to ignore its own phrase, and
  # in held-out audio it punishes correct fires.
  background_paths: ["data/backgrounds"]
  rir_paths: ["data/rirs"]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
max_negative_weight: 3000.0

# Hyperparameter sweep. Every variant trains against BYTE-IDENTICAL data -
# generate/augment/features run once and are shared - which is the only reason
# comparing them means anything. pipeline.py refuses a variant that reaches
# past training into the data stages (TRAINING_ONLY lists what is allowed);
# to sweep n_samples or the SNR, change it here and re-run the whole thing.
#
# Rank the results with Bench.bat, NOT with the eval table. On both sweeps so
# far the synthetic eval scored every candidate identically with DET curves
# flat against the axes - it is saturated and ranks nothing.
variants:
  medium:       {model: {model_size: medium}}
  # TRAINING LENGTH IS THE ONE LEVER THAT HAS WORKED. Measured 2026-08-16 with
  # --snr-sweep, recall with the phrase said OVER room audio:
  #
  #                      +20dB  +15dB  +10dB   +5dB   0dB
  #     medium (100k)      39%    35%    23%    17%    9%
  #     medium-200k        47%    40%    32%    19%   11%
  #     v1.0 (incumbent)   46%    35%    21%    15%    9%
  #
  # 200k beats both at every single SNR. The clean bench had said the opposite
  # ("more steps just raised signal and noise together") because it could not
  # see this axis at all - which is why 400k is here rather than a guess.
  medium-200k:  {model: {model_size: medium}, steps: 200000}
  medium-400k:  {model: {model_size: medium}, steps: 400000}
  # large loses to medium in every generation on every axis - do not re-add it.
  # The stock hey_jarvis that outperformed all of this uses a DNN head, not
  # conv_attention. Uncomment to find out whether the head is the difference.
  # dnn-medium: {model: {model_type: dnn, model_size: medium}}

# The ceiling find_best_threshold optimises recall against. Only means anything
# once make_validation.py has replaced the validation set with real room audio;
# against livekit's stock synthetic set it produced three sizes that scored
# identically and could not be ranked.
target_fp_per_hour: 0.2
